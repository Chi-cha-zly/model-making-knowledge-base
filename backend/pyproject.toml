[project]
name = "model-knowledge-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "fastapi>=0.115,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.5,<1",
  "python-multipart>=0.0.9,<1",
  "uvicorn>=0.30,<1",
  "langchain-core>=1.6.9",
  "langchain-openai>=1.7.0",
  "langsmith>=0.14.6",
  "keyring>=25,<26",
  "filelock>=3.16,<4",
  "langchain>=1.4,<2",
  "langgraph>=1.2,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
lint = ["ruff==0.17.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.package-data]
"app.services" = ["*.swift"]

[tool.ruff]
required-version = "==0.17.0"
target-version = "py311"
line-length = 100
extend-exclude = [".local"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "single"
